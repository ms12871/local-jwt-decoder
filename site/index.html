<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Local JWT & Claim Inspector</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 2rem 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      max-width: 900px;
      width: 100%;
    }
    header {
      margin-bottom: 1.5rem;
      border-bottom: 1px solid #334155;
      padding-bottom: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }
    h1 { font-size: 1.5rem; color: #38bdf8; }
    .badge-sec {
      background: #14532d;
      color: #4ade80;
      padding: 0.25rem 0.6rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      border: 1px solid #16a34a;
    }
    textarea {
      width: 100%;
      height: 130px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 0.5rem;
      color: #f8fafc;
      padding: 0.75rem;
      font-family: monospace;
      font-size: 0.85rem;
      resize: vertical;
      margin-bottom: 1rem;
    }
    textarea:focus { outline: 1px solid #38bdf8; }
    .status-bar {
      margin-bottom: 1.5rem;
      display: flex;
      gap: 1rem;
      align-items: center;
      min-height: 32px;
    }
    .pill {
      font-size: 0.8rem;
      padding: 0.25rem 0.6rem;
      border-radius: 0.375rem;
      font-weight: 600;
    }
    .pill-active { background: #166534; color: #bbf7d0; }
    .pill-expired { background: #991b1b; color: #fecaca; }
    .pill-idle { background: #334155; color: #94a3b8; }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }
    @media (max-width: 768px) {
      .grid { grid-template-columns: 1fr; }
    }
    .panel {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 0.5rem;
      overflow: hidden;
    }
    .panel-header {
      background: #0f172a;
      padding: 0.5rem 0.75rem;
      font-size: 0.8rem;
      font-weight: 700;
      color: #94a3b8;
      border-bottom: 1px solid #334155;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    pre {
      padding: 1rem;
      overflow-x: auto;
      font-size: 0.82rem;
      color: #38bdf8;
      line-height: 1.4;
      max-height: 400px;
    }
    .claims-detail {
      margin-top: 1rem;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 0.5rem;
      padding: 1rem;
    }
    .claim-row {
      display: flex;
      justify-content: space-between;
      padding: 0.35rem 0;
      border-bottom: 1px solid #334155;
      font-size: 0.85rem;
    }
    .claim-key { color: #94a3b8; font-weight: 600; }
    .claim-val { color: #f8fafc; word-break: break-all; margin-left: 1rem; text-align: right; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>Local JWT Decoder</h1>
        <p style="font-size: 0.8rem; color: #94a3b8; margin-top: 0.25rem;">Client-side inspection | Zero external network calls</p>
      </div>
      <span class="badge-sec">Browser Sandboxed</span>
    </header>

    <textarea id="token-input" placeholder="Paste encoded JSON Web Token (eyJhbGciOi...) here..."></textarea>

    <div class="status-bar">
      <span id="expiry-badge" class="pill pill-idle">Awaiting Token</span>
      <span id="expiry-time" style="font-size: 0.85rem; color: #94a3b8;"></span>
    </div>

    <div class="grid">
      <div class="panel">
        <div class="panel-header">Header</div>
        <pre id="header-output">// Decoded JOSE Header</pre>
      </div>
      <div class="panel">
        <div class="panel-header">Payload</div>
        <pre id="payload-output">// Decoded Claims Payload</pre>
      </div>
    </div>

    <div class="claims-detail" id="parsed-details" style="display: none;">
      <h3 style="font-size: 0.9rem; color: #38bdf8; margin-bottom: 0.5rem;">Key IAM Claims</h3>
      <div class="claim-row"><span class="claim-key">Subject (sub):</span><span class="claim-val" id="claim-sub">-</span></div>
      <div class="claim-row"><span class="claim-key">Issuer (iss):</span><span class="claim-val" id="claim-iss">-</span></div>
      <div class="claim-row"><span class="claim-key">Audience (aud):</span><span class="claim-val" id="claim-aud">-</span></div>
      <div class="claim-row"><span class="claim-key">Issued At (iat):</span><span class="claim-val" id="claim-iat">-</span></div>
      <div class="claim-row" style="border-bottom: none;"><span class="claim-key">Expiration (exp):</span><span class="claim-val" id="claim-exp">-</span></div>
    </div>
  </div>

  <script>
    function parseBase64Url(str) {
      let base64 = str.replace(/-/g, '+').replace(/_/g, '/');
      while (base64.length % 4) { base64 += '='; }
      return decodeURIComponent(atob(base64).split('').map(c => {
        return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
      }).join(''));
    }

    const input = document.getElementById('token-input');
    const headerOut = document.getElementById('header-output');
    const payloadOut = document.getElementById('payload-output');
    const badge = document.getElementById('expiry-badge');
    const expText = document.getElementById('expiry-time');
    const details = document.getElementById('parsed-details');

    input.addEventListener('input', () => {
      const raw = input.value.trim();
      if (!raw) {
        headerOut.textContent = '// Decoded JOSE Header';
        payloadOut.textContent = '// Decoded Claims Payload';
        badge.className = 'pill pill-idle';
        badge.textContent = 'Awaiting Token';
        expText.textContent = '';
        details.style.display = 'none';
        return;
      }

      const parts = raw.split('.');
      if (parts.length < 2) {
        badge.className = 'pill pill-expired';
        badge.textContent = 'Malformed JWT';
        expText.textContent = 'Expected period-separated segments';
        details.style.display = 'none';
        return;
      }

      try {
        const header = JSON.parse(parseBase64Url(parts[0]));
        const payload = JSON.parse(parseBase64Url(parts[1]));

        headerOut.textContent = JSON.stringify(header, null, 2);
        payloadOut.textContent = JSON.stringify(payload, null, 2);
        details.style.display = 'block';

        document.getElementById('claim-sub').textContent = payload.sub || 'N/A';
        document.getElementById('claim-iss').textContent = payload.iss || 'N/A';
        document.getElementById('claim-aud').textContent = payload.aud || 'N/A';
        document.getElementById('claim-iat').textContent = payload.iat ? new Date(payload.iat * 1000).toLocaleString() : 'N/A';
        document.getElementById('claim-exp').textContent = payload.exp ? new Date(payload.exp * 1000).toLocaleString() : 'N/A';

        if (payload.exp) {
          const now = Math.floor(Date.now() / 1000);
          if (now > payload.exp) {
            badge.className = 'pill pill-expired';
            badge.textContent = 'Expired';
            expText.textContent = `Expired on ${new Date(payload.exp * 1000).toLocaleTimeString()}`;
          } else {
            badge.className = 'pill pill-active';
            badge.textContent = 'Active (Valid)';
            const diffMin = Math.round((payload.exp - now) / 60);
            expText.textContent = `Expires in ~${diffMin} minute(s)`;
          }
        } else {
          badge.className = 'pill pill-idle';
          badge.textContent = 'No Expiration Claim';
          expText.textContent = '';
        }
      } catch (err) {
        badge.className = 'pill pill-expired';
        badge.textContent = 'Parse Error';
        expText.textContent = err.message;
        details.style.display = 'none';
      }
    });
  </script>
</body>
</html>
